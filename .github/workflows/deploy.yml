name: Deploy to Cloud Run

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Build the web app into the backend
        working-directory: web
        run: |
          npm ci
          npm run build

      - name: Backend tests
        working-directory: backend
        run: ./mvnw -B test

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/199277557753/locations/global/workloadIdentityPools/github-pool/providers/github-provider
          service_account: bonafide-api@bonafide-cup-2026.iam.gserviceaccount.com

      - name: Deploy to Cloud Run
        run: |
          gcloud run deploy bonafide-api --source backend --region asia-southeast1 \
            --service-account bonafide-api@bonafide-cup-2026.iam.gserviceaccount.com --allow-unauthenticated \
            --no-cpu-throttling --min-instances 1 --max-instances 3 --cpu 1 --memory 2Gi \
            --timeout 300 --cpu-boost \
            --set-env-vars "GOOGLE_CLOUD_PROJECT=bonafide-cup-2026,GOOGLE_CLOUD_LOCATION=global,GOOGLE_GENAI_USE_VERTEXAI=true,BONAFIDE_REGION=asia-southeast1,BONAFIDE_BUCKET=bonafide-cup-2026.firebasestorage.app,BONAFIDE_MODEL_MAIN=gemini-3.8-flash,BONAFIDE_MODEL_SMALL=gemini-3.5-flash-lite,BONAFIDE_MODEL_ARMOR_TEMPLATE=bonafide-input,BONAFIDE_DEMO_MODE=true,BONAFIDE_GROUNDING_MIN=0.6,BONAFIDE_SCHEDULER_SA=bonafide-scheduler@bonafide-cup-2026.iam.gserviceaccount.com"
          URL=$(gcloud run services describe bonafide-api --region asia-southeast1 --format='value(status.url)')
          gcloud run services update bonafide-api --region asia-southeast1 --update-env-vars "BONAFIDE_SERVICE_URL=$URL"
          curl -sf "$URL/actuator/health"
